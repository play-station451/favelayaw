version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 21
            - java -version
            - chmod +x ./gradlew

            - ./gradlew build || true

            - 'MC_JAR=$(find ~/.gradle -iname "*minecraft*.jar" 2>/dev/null | grep -vi sources | head -n 1)'
            - echo "Minecraft jar found at $MC_JAR"

            - echo "=== 26.2 Carried Slot Packet ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.network.protocol.game.ServerboundSetCarriedItemPacket 2>&1 || true'

            - echo "=== 26.2 Explosion Packet ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.network.protocol.game.ClientboundExplodePacket 2>&1 || true'

            - echo "=== 26.2 Remove Entities Packet ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.network.protocol.game.ClientboundRemoveEntitiesPacket 2>&1 || true'
            
            - 'artifact push workflow build/libs'
