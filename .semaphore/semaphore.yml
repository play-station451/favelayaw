version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 21
            - java -version
            - chmod +x ./gradlew

            - ./gradlew build || true

            - 'MC_JAR=$(find ~/.gradle -iname "*minecraft*.jar" 2>/dev/null | grep -vi sources | head -n 1)'
            - echo "Minecraft jar found at $MC_JAR"
            - echo "=== Check if jar exists and is readable ==="
            - 'test -f "$MC_JAR" && echo "JAR exists" || echo "JAR NOT FOUND"'
            - echo "=== List net.minecraft.block classes ==="
            - 'jar tf "$MC_JAR" | grep "net/minecraft/block/BlockState.class" || echo "BlockState not found"'
            - 'jar tf "$MC_JAR" | grep "net/minecraft/entity/Entity.class" || echo "Entity not found"'
            - 'jar tf "$MC_JAR" | grep "net/minecraft/util/math/BlockPos.class" || echo "BlockPos not found"'

            - 'artifact push workflow build/libs'
