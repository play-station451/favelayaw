version: v1.0
name: Build Java

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Inspect
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout

            - sem-version java 25
            - java -version
            - javac -version

            - chmod +x ./gradlew

            - echo "=== Gradle Properties ==="
            - ./gradlew properties

            - echo "=== Minecraft / Fabric Versions ==="
            - './gradlew properties | grep -Ei "minecraft_version|loader_version|fabric_api_version|loom_version|java" || true'

            - echo "=== Gradle Version ==="
            - ./gradlew --version

            - echo "=== Build ==="
            - ./gradlew clean build --stacktrace

            - echo "=== Build Artifacts ==="
            - find build/libs -maxdepth 1 -type f -print

            - echo "=== Minecraft Cache ==="
            - 'find ~/.gradle/caches -type f -path "*/com.mojang/minecraft/*/*.jar" 2>/dev/null | grep -vE "(sources|javadoc)" | sort'

            - echo "=== Minecraft JAR ==="
            - 'MC_JAR=$(find ~/.gradle/caches -type f -path "*/com.mojang/minecraft/*/*.jar" 2>/dev/null | grep -vE "(sources|javadoc)" | sort | head -n 1)'
            - 'test -n "$MC_JAR"'
            - 'echo "Minecraft jar: $MC_JAR"'

            - echo "=== Mapping / Loom Cache ==="
            - 'find ~/.gradle/caches -type f \( -iname "*mapping*.jar" -o -iname "*mappings*.jar" \) 2>/dev/null | grep -vE "(sources|javadoc)" | sort | head -n 100'

            - echo "=== Crystal Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "EndCrystal|Crystal|end_crystal" | head -n 100 || true'

            - echo "=== Interaction / Inventory Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Interact|Interaction|Inventory|Slot|SelectedSlot|GameMode|Gameplay" | head -n 200 || true'

            - echo "=== Entity Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Entity|LivingEntity|Player" | head -n 200 || true'

            - echo "=== Relevant Minecraft Packages ==="
            - 'jar tf "$MC_JAR" | grep -Ei "network/.*packet|client/multiplayer|world/level|world/item|world/entity" | head -n 300 || true'

            - echo "=== MultiPlayerGameMode ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -Ei -A 8 -B 3 "attack|use|interact|destroy|startPrediction|continueDestroy" || true'

            - echo "=== ClientPacketListener ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.client.multiplayer.ClientPacketListener 2>&1 | grep -Ei -A 5 -B 3 "send|packet|connection" | head -n 150 || true'

            - echo "=== Serverbound Packets ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Serverbound.*(Interact|Swing|Use|Move|Slot)" | sort || true'

            - echo "=== Clientbound Crystal / Entity Packets ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Clientbound.*(AddEntity|RemoveEntities|LevelEvent|Explosion|Entity)" | sort | head -n 200 || true'

            - echo "=== Damage / Explosion Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Explosion|Damage|CombatRules|Difficulty" | sort | head -n 200 || true'

            - echo "=== Fabric / Loader Dependencies ==="
            - './gradlew dependencies --configuration compileClasspath | grep -Ei "minecraft|fabric-loader|fabric-api" | head -n 200 || true'

            - echo "=== Loom Tasks ==="
            - './gradlew tasks --all | grep -Ei "loom|mapping|minecraft" | head -n 200 || true'

            - echo "=== Final Build ==="
            - './gradlew build --stacktrace'

            - echo "=== Output ==="
            - 'find build/libs -maxdepth 1 -type f -printf "%p\n"'

            - 'artifact push workflow build/libs'
