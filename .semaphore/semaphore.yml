version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 25
            - java -version
            - chmod +x ./gradlew

            - ./gradlew properties

            - echo "=== Minecraft / Fabric Versions ==="
            - './gradlew properties | grep -Ei "minecraft_version|loader_version|fabric_version|java"'

            - echo "=== Compile Classpath ==="
            - './gradlew dependencies --configuration compileClasspath | grep -Ei "minecraft|fabric-loader|fabric-api" | head -n 100'

            - echo "=== Gradle Build Environment ==="
            - ./gradlew buildEnvironment

            - echo "=== Minecraft / Mappings JARs ==="
            - 'find ~/.gradle/caches -type f \( -iname "*minecraft*.jar" -o -iname "*mappings*.jar" \) 2>/dev/null | grep -vE "(sources|javadoc)" | head -n 100'

            - echo "=== Minecraft JAR ==="
            - 'MC_JAR=$(find ~/.gradle/caches -type f -iname "*minecraft*.jar" 2>/dev/null | grep -vE "(sources|javadoc)" | head -n 1)'
            - echo "Minecraft jar found at $MC_JAR"

            - echo "=== Crystal Classes ==="
            - 'jar tf "$MC_JAR" 2>/dev/null | grep -Ei "crystal|endcrystal" | head -n 100 || true'

            - echo "=== Entity Classes ==="
            - 'jar tf "$MC_JAR" 2>/dev/null | grep -Ei "/entity/" | head -n 100 || true'

            - echo "=== Block Classes ==="
            - 'jar tf "$MC_JAR" 2>/dev/null | grep -Ei "/block/" | head -n 100 || true'

            - echo "=== Interaction Classes ==="
            - 'jar tf "$MC_JAR" 2>/dev/null | grep -Ei "interaction|interact|gamemode|game_mode" | head -n 100 || true'

            - echo "=== Fabric Loader ==="
            - 'find ~/.gradle/caches -type f -iname "*fabric-loader*.jar" 2>/dev/null | head -n 50'

            - echo "=== Loom Tasks ==="
            - './gradlew tasks --all | grep -Ei "loom|minecraft|mapping" | head -n 100'

            - echo "=== Gradle Version ==="
            - ./gradlew --version

            - javac -version

            - ./gradlew clean build --stacktrace

            - 'find build/libs -maxdepth 1 -type f -print'

            - 'artifact push workflow build/libs'
