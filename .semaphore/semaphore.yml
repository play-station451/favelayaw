version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 21
            - java -version
            - chmod +x ./gradlew
            - ./gradlew build || true
            - 'MC_JAR=$(find ~/.gradle -iname "*minecraft*.jar" 2>/dev/null | grep -vi sources | head -n 1)'
            - unzip -p "$MC_JAR" net/minecraft/world/entity/LivingEntity.class > /tmp/LE.class
            - javap -p /tmp/LE.class | grep -i "hasEffect\|NIGHT_VISION\|MobEffect"
            - artifact push workflow build/libs