version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 21
            - java -version
            - chmod +x ./gradlew
            - ./gradlew build
            - artifact push workflow build/libs