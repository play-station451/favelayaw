version: v1.0
name: Build Java
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 21
            - java -version
            - chmod +x ./gradlew

            - ./gradlew build || true

            - 'MC_JAR=$(find ~/.gradle -iname "*minecraft*.jar" 2>/dev/null | grep -vi sources | head -n 1)'
            - echo "Minecraft jar found at $MC_JAR"
            - echo "=== Minecraft JAR Contents ==="
            - 'jar tf "$MC_JAR" | grep -Ei "MultiPlayerGameMode|EndCrystal|Crystal|Inventory|Interaction|Explosion" | head -n 300 || true'

            - echo "=== MultiPlayerGameMode ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 || true'

            - echo "=== MultiPlayerGameMode Crystal/Interaction Methods ==="
            - 'javap -classpath "$MC_JAR" -p net.minecraft.client.multiplayer.MultiPlayerGameMode 2>&1 | grep -Ei -A 8 -B 3 "attack|useItem|useItemOn|interact|destroy|startDestroy|continueDestroy|prediction" || true'

            - echo "=== Client Packet Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "net/minecraft/network/protocol/game/(Serverbound|Clientbound)" | grep -Ei "Interact|Swing|Move|Slot|Entity|Explosion" | sort | head -n 300 || true'

            - echo "=== Serverbound Interaction Packets ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Serverbound.*(Interact|Swing|Use|Move|Slot)" | sort || true'

            - echo "=== Entity / Crystal Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "EndCrystal|EnderCrystal|Crystal" | sort || true'

            - echo "=== Explosion / Damage Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "Explosion|CombatRules|DamageSource|DamageSources" | sort | head -n 200 || true'

            - echo "=== Relevant World / Entity Classes ==="
            - 'jar tf "$MC_JAR" | grep -Ei "world/level|world/entity|world/item" | grep -Ei "Player|LivingEntity|Entity|Block|ItemStack|Interaction" | head -n 300 || true'

            - 'artifact push workflow build/libs'
