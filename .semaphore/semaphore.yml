version: v1.0
name: Build Java

agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: Build and Test
    task:
      jobs:
        - name: Gradle Build
          commands:
            - checkout
            - sem-version java 25
            - java -version
            - chmod +x ./gradlew

            - |
              echo "=== Gradle Properties ==="
              ./gradlew properties

            - |
              echo "=== Minecraft / Fabric Versions ==="
              ./gradlew properties | grep -Ei \
                "minecraft_version|loader_version|fabric_version|java"

            - |
              echo "=== Compile Classpath ==="
              ./gradlew dependencies --configuration compileClasspath \
                | grep -Ei "minecraft|fabric-loader|fabric-api" \
                | head -n 100

            - |
              echo "=== Gradle Build Environment ==="
              ./gradlew buildEnvironment

            - |
              echo "=== Loom / Minecraft Cache ==="
              find ~/.gradle/caches \
                -type f \
                \( -iname "*minecraft*.jar" -o -iname "*mappings*.jar" \) \
                2>/dev/null \
                | grep -vE "(sources|javadoc)" \
                | head -n 100

            - |
              echo "=== Fabric Loader Cache ==="
              find ~/.gradle/caches \
                -type f \
                -iname "*fabric-loader*.jar" \
                2>/dev/null \
                | head -n 50

            - |
              echo "=== Minecraft Classes ==="
              MC_JAR=$(find ~/.gradle/caches \
                -type f \
                -iname "*minecraft*.jar" \
                2>/dev/null \
                | grep -vE "(sources|javadoc)" \
                | head -n 1)

              echo "MC_JAR=$MC_JAR"

              if [ -n "$MC_JAR" ]; then
                echo "--- Crystal classes ---"
                jar tf "$MC_JAR" \
                  | grep -Ei "crystal|endcrystal" \
                  | head -n 100

                echo "--- Entity classes ---"
                jar tf "$MC_JAR" \
                  | grep -Ei "/entity/" \
                  | head -n 100

                echo "--- Block classes ---"
                jar tf "$MC_JAR" \
                  | grep -Ei "/block/" \
                  | head -n 100

                echo "--- Interaction classes ---"
                jar tf "$MC_JAR" \
                  | grep -Ei "interaction|interact|gamemode|game_mode" \
                  | head -n 100
              else
                echo "WARNING: Could not locate Minecraft jar"
              fi

            - |
              echo "=== Fabric Loom Tasks ==="
              ./gradlew tasks --all \
                | grep -Ei "loom|minecraft|mapping" \
                | head -n 100

            - |
              echo "=== Java Compiler ==="
              javac -version

            - |
              echo "=== Gradle Version ==="
              ./gradlew --version

            - |
              echo "=== Attempting Build ==="
              ./gradlew clean build --stacktrace

            - |
              echo "=== Built Artifacts ==="
              find build/libs -maxdepth 1 -type f -print

            - 'artifact push workflow build/libs'
